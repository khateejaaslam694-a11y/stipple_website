<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery - Stipple</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
           <a href="index.html" class="logo">
    <img src="images/stipple-logo.png" alt="Stipple Logo" class="site-logo">
</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Analyze</a>
                <a href="color-blindness.html" class="nav-link">Color Blindness</a>
                <a href="gallery.html" class="nav-link active">
                    My Gallery
                    <span class="gallery-count" id="galleryCount">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero hero-small" id="hero">
        <canvas id="stippleCanvas"></canvas>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <p class="hero-tagline">Your Collection</p>
            <h1 class="hero-title">
                <span>Color</span>
                <span class="gradient-text">Memories</span>
            </h1>
            <div class="hero-dots">
                <span></span><span></span><span></span><span class="center"></span><span></span><span></span><span></span>
            </div>
        </div>
    </section>

    <main class="main">
        <!-- Gallery Actions -->
        <section class="gallery-actions">
            <div class="container">
                <div class="actions-bar">
                    <div class="gallery-stats">
                        <span class="stat-number" id="totalArtworks">0</span>
                        <span class="stat-label">Saved Artworks</span>
                    </div>
                    <div class="actions-right">
                        <button class="action-btn outline" id="exportBtn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            Export Collection
                        </button>
                        <button class="action-btn danger" id="clearAllBtn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                            Clear All
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Empty State -->
        <section class="empty-state" id="emptyState">
            <div class="container">
                <div class="empty-content">
                    <div class="empty-icon">
                        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                    </div>
                    <h3>No Saved Artworks Yet</h3>
                    <p>Start by analyzing an image and saving it to your gallery. Your color memories will appear here.</p>
                    <a href="index.html" class="action-btn primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Analyze Your First Image
                    </a>
                </div>
            </div>
        </section>

        <!-- Gallery Grid -->
        <section class="gallery-section" id="gallerySection" hidden>
            <div class="container">
                <div class="gallery-grid" id="galleryGrid">
                    <!-- Artwork cards will be generated here -->
                </div>
            </div>
        </section>
    </main>

    <!-- Artwork Detail Modal -->
    <div class="modal" id="artworkModal">
        <div class="modal-backdrop"></div>
        <div class="modal-content modal-large">
            <button class="modal-close" id="modalClose">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <div class="modal-body" id="artworkModalBody"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <span class="toast-message"></span>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Stipple. Every Dot Tells a Color Story.</p>
        </div>
    </footer>

    <script src="js/color-utils.js"></script>
    <script src="js/stipple-animation.js"></script>
    <script src="js/gallery.js"></script>
</body>
</html>
